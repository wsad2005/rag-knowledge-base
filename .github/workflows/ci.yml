name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 与 pyproject.toml 的 requires-python = ">=3.11" 保持一致
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 以下步骤与 README 的“安装 / 检查 / 测试 / 运行”命令一一对应
      - name: 安装项目与开发依赖
        run: python -m pip install -e ".[dev]"

      - name: Ruff 代码检查
        run: ruff check .

      - name: 运行测试
        run: python -m pytest -q

      - name: 端到端 Mock 演示（无需密钥、不联网）
        run: python -m rag_knowledge_base
