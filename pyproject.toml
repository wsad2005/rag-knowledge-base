# 本项目以 requirements*.txt 为依赖来源（便于 Docker 与 CI 直接使用），
# 这里只保留工具配置，不做可安装包的分发配置。

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: 较慢的集成测试（真实 Chroma 持久化）",
]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的 Depends/File/Query 作为默认值是其官方推荐写法
"app/api/*.py" = ["B008"]
# 样例文档是长段落文本，不按代码行宽折行
"scripts/make_samples.py" = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
